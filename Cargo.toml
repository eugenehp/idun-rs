[package]
name          = "idun"
version       = "0.0.2"
edition       = "2021"
rust-version  = "1.75"
description   = "Async Rust client, CLI, and TUI for streaming real-time EEG, IMU, and impedance data from IDUN Guardian earbuds over Bluetooth Low Energy"
keywords      = ["eeg", "imu", "guardian", "idun", "neuroscience"]
categories    = ["hardware-support", "science", "command-line-utilities"]
license       = "MIT"
readme        = "README.md"
homepage      = "https://github.com/eugenehp/idun"
repository    = "https://github.com/eugenehp/idun"
documentation = "https://docs.rs/idun"
include       = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# ── Library target ────────────────────────────────────────────────────────────
# Produces `libidun.rlib`.  Downstream crates depend on this target;
# the CLI and TUI binaries below are separate.

[lib]
name = "idun"
path = "src/lib.rs"

# ── Binary targets ────────────────────────────────────────────────────────────

# Headless CLI: scan, connect, and print all events to stdout.
[[bin]]
name = "idun"
path = "src/main.rs"

# Full-screen ratatui TUI — requires the `tui` feature (enabled by default).
[[bin]]
name = "idun-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

# ── Features ──────────────────────────────────────────────────────────────────
#
# tui (default)          — pulls in ratatui + crossterm for the terminal UI.
# local-decode (default) — enables experimental local EEG/IMU packet decoders.
#
# Library consumers that don't need the TUI or the speculative decoders can
# opt out and avoid compiling those dependencies:
#
#   [dependencies]
#   idun = { version = "0.1.0", default-features = false }
#   idun = { version = "0.1.0", default-features = false, features = ["local-decode"] }

[features]
default      = ["tui", "local-decode"]
tui          = ["dep:ratatui", "dep:crossterm"]
local-decode = []
simulate     = []

# ── Core library dependencies ─────────────────────────────────────────────────

[dependencies]
btleplug          = "0.11.8"
tokio             = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
uuid              = { version = "1", features = ["v4"] }
futures           = "0.3"
log               = "0.4"
env_logger        = "0.11"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
anyhow            = "1"
base64            = "0.22"

# ── Optional TUI dependencies (feature = "tui") ───────────────────────────────

ratatui   = { version = "0.30.0", features = ["crossterm"], optional = true }
crossterm = { version = "0.29", optional = true }
